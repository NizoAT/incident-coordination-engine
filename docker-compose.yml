services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ice
      POSTGRES_PASSWORD: ice
      POSTGRES_DB: incident_coordination_engine
    ports:
      - "5433:5432"
    volumes:
      - ice_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice -d incident_coordination_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ice_pg_data:
