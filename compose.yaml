# Incident Coordination Engine — dev stack (M10) + Nginx proxy (M12)
# Usage : docker compose up --build
# App (via proxy) : http://localhost:8080
# Postgres (host) : localhost:5433

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ice
      POSTGRES_PASSWORD: ice
      POSTGRES_DB: incident_coordination_engine
    ports:
      - "5433:5432"
    volumes:
      - ice_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice -d incident_coordination_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://ice:ice@postgres:5432/incident_coordination_engine?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-32chars-min!!}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-github-webhook-secret-change-me}
      SLA_TICK_INTERVAL_MS: ${SLA_TICK_INTERVAL_MS:-30000}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app
      - ice_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/conf.d/00-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./deploy/nginx/conf.d/ice.conf:/etc/nginx/conf.d/ice.conf:ro
    command: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ice_pg_data:
  ice_node_modules:
